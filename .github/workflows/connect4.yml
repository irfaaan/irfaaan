name: "🔴 Connect 4"
on:
  issues:
    types: [opened]

jobs:
  play:
    # issue title looks like:  connect4|drop|{col}   or   connect4|reset
    if: startsWith(github.event.issue.title, 'connect4|')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Drop the disc
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python games/connect4.py

      - name: Commit updated board
        run: |
          git config user.name "arcade-bot"
          git config user.email "arcade-bot@users.noreply.github.com"
          git add README.md
          git diff --quiet --cached || git commit -m "🔴 connect4 move by ${{ github.event.issue.user.login }}"
          git push

      - name: Close the move issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
